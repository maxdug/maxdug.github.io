{% include header.html %}
<main>
    <div class="article">
        <p>{{ page.genre }}</p>
        <h1>{{ page.title }}</h1>
        <p>By {{ page.author }}</p>
        <p>{{ page.description }}</p>
        <p><a href="/books">View All books</a></p>

        <div id="recipe-hero" style="background-image: url({{page.heroimage}});">&nbsp;</div>
        {{ content }}
        <p>{{ page.cooktime }} | {{ page.servingsize }} | <a class="btn-outline" onclick="copyDivToClipboard()">Copy Grocery List</a> | <a href="/recipes">View All Recipes</a></p>
    </div>
</main>
{% include footer.html %}
